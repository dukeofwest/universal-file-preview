<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Universal File Preview demo</title>
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      body { margin: 0; padding: 28px; color: #20242a; background: #edf0f3; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 1050px; margin: auto; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 18px; }
      h1 { font-size: 1.4rem; margin: 0; }
      #viewer { height: min(78vh, 850px); min-height: 360px; }
      input[type="file"] { max-width: 270px; font: 14px/1.45 system-ui, sans-serif; color: #20242a; }
      input[type="file"]::file-selector-button {
        font: inherit;
        color: inherit;
        background: #fff;
        border: 1px solid #c8cdd3;
        border-radius: 5px;
        padding: 5px 9px;
        margin-right: 8px;
        cursor: pointer;
      }
      input[type="file"]::file-selector-button:hover { background: #f7f8fa; }
      input[type="file"]:focus-visible::file-selector-button { outline: 2px solid #2768d8; outline-offset: 2px; }
      @media (max-width: 600px) { body { padding: 12px; } header { align-items: flex-start; flex-direction: column; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><h1>Universal File Preview</h1><div>Choose an image or Office Open XML file to preview.</div></div>
        <input id="file" type="file" aria-label="Choose a file to preview" />
      </header>
      <div id="viewer"></div>
    </main>
    <script type="module">
      import { FilePreviewer } from "../../dist/index.js";
      const container = document.querySelector("#viewer");
      const sample = `<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"><rect width="720" height="420" rx="24" fill="#e8f0ff"/><circle cx="360" cy="178" r="92" fill="#2768d8"/><path d="M320 178h80m-40-40v80" stroke="white" stroke-width="18" stroke-linecap="round"/><text x="360" y="340" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#18375f">Select a file to preview</text></svg>`;
      let viewer = new FilePreviewer({ container, file: { name: "welcome.svg", source: new TextEncoder().encode(sample) } });
      await viewer.open();
      document.querySelector("#file").addEventListener("change", async event => {
        const file = event.target.files?.[0]; if (!file) return;
        try { await viewer.load({ name: file.name, source: file, mimeType: file.type }); }
        catch { /* The viewer renders its typed error state. */ }
      });
      window.addEventListener("pagehide", () => viewer.destroy(), { once: true });
    </script>
  </body>
</html>
