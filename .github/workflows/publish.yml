name: Publish to npm
# Publishes the checked-out commit through npm trusted publishing (OpenID Connect): no npm token is stored in the
# repository, and npm attaches provenance (a signed statement linking the package to this repository, workflow and
# commit). Started by hand only; the "npm" environment can require a reviewer's approval.
#
# One-time setup on npmjs.com (package settings, "Trusted publisher"): GitHub Actions, repository
# dukeofwest/universal-file-preview, workflow file publish.yml, environment npm.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for a short-lived publish credential
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 bundles npm 10.
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:security
      - run: npm run test:performance
      - run: npm publish --provenance --access public
