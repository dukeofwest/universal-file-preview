name: Bug report
description: Report a reproducible problem in the library or demo.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Please do not attach confidential documents. Minimize the file or create a synthetic fixture when possible."
  - type: input
    id: version
    attributes:
      label: Package version or commit
      placeholder: "0.1.1 or commit hash"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include a small sanitized example or steps that reproduce the issue.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
  - type: textarea
    id: logs
    attributes:
      label: Relevant error or console output
      render: text
